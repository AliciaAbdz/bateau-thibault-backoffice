@if (user()) {
  <div class="flex flex-col items-center bg-white rounded-2xl shadow-md p-6 w-full text-[#4B4B4B]">
    <!-- Avatar -->
    <div class="w-24 h-24 rounded-full border-4 border-[#7BC67E] overflow-hidden mb-4">
      <img src="/images/Avatar.png" alt="avatar" class="w-full h-full object-cover">
    </div>

    <!-- Nom -->
    <p class="font-bold text-lg">{{ user()!.name }}</p>

    <!-- Rôle -->
    <span class="mt-2 px-4 py-1 text-sm font-semibold text-green-700 bg-green-100 border border-[#7BC67E] rounded-full">
      {{ user()!.role }}
    </span>

    <!-- Séparateur -->
    <hr class="w-full border-gray-200 my-5">

    <!-- Infos connexion -->
    <div class="text-sm text-gray-500 space-y-1 text-center">
      <p>Dernière connexion : <span class="font-medium text-[#4B4B4B]">{{ user()!.lastConnexion }}</span></p>
      <p>Dernière modification : <span class="font-medium text-[#4B4B4B]">{{ user()!.lastModification }}</span></p>
    </div>
  </div>
}
