<div class="flex flex-col min-h-screen" style="background: linear-gradient(to bottom, rgba(197, 255, 199, 0.1) 0%, rgba(186, 255, 189, 0.1) 100%)">
  <!-- Header -->
  <mobile-header [StepName]="'VALIDATION'"></mobile-header>

  <!-- Contenu -->
  <div class="flex-1 flex flex-col items-center px-6 py-8">
    <!-- Card validation -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-6 w-full max-w-sm flex flex-col items-center">
      <!-- Icône check -->
      <div class="w-14 h-14 flex items-center justify-center mb-4">
        <svg class="w-12 h-12 text-[#7BC67E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>

      <!-- Nom du produit -->
      <h2 class="text-lg font-bold text-[#4B4B4B] mb-4">{{ name || 'PRODUIT' }}</h2>

      <!-- Message de confirmation -->
      <p class="text-sm text-[#7BC67E] font-semibold mb-4">Ajout au stock confirmé !</p>

      <!-- Infos produit -->
      <div class="w-full text-sm text-[#4B4B4B] space-y-1">
        <p><span class="font-bold">CATEGORIE :</span> {{ category }}</p>
        <p><span class="font-bold">QUANTITE AJOUTEE :</span> {{ quantity }}</p>
        <p><span class="font-bold">PRIX D'ACHAT :</span> {{ purchasePrice }} €/u</p>
      </div>
    </div>

    <!-- Bouton retour dashboard -->
    <button (click)="goToDashboard()"
      class="mt-8 w-full max-w-sm py-4 bg-[#7BC67E] text-white text-lg font-bold uppercase rounded-full shadow-md hover:opacity-90 cursor-pointer">
      RETOUR AU DASHBOARD
    </button>
  </div>

  <!-- Footer -->
  <app-bottom-nav-mobile></app-bottom-nav-mobile>
</div>
